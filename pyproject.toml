[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codesentinel"
version = "0.1.0"
description = "A safe, evidence-based API security scanner for authorized targets"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "openapi-spec-validator>=0.7,<1",
  "redis>=5,<6",
  "rq>=2,<3",
  "email-validator>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["app*", "test_api*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
